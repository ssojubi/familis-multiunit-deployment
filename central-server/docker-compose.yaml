services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic/tls.yml
      # The kiosk's existing internal services use a self-signed certificate.
      - --serversTransport.insecureSkipVerify=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Preserve the ports that the kiosk UI and its API already use.
      - --entrypoints.familis.address=:5173
      - --entrypoints.familis-api.address=:8080
      - --entrypoints.central-api.address=:8000
    ports:
      - "80:80"
      - "443:443"
      - "5173:5173"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/tls.yml:/etc/traefik/dynamic/tls.yml:ro
      - "8000:8000"
      - ../certs:/etc/traefik/certs:ro

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: confluentinc/cp-kafka:7.4.1
    container_name: kafka-init
    depends_on:
      - kafka
    command: >
      bash -c '
        echo "Waiting for Kafka broker..."
        for i in {1..60}; do
          kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          echo "  Not ready..."
          sleep 2
        done
        echo "Creating Kafka topics..."
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic video-frames --partitions 3 --replication-factor 1
        echo "Kafka topics ready:"
        kafka-topics --bootstrap-server kafka:9092 --list
      '

  mysql:
    image: mysql:8
    container_name: central-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: familis_central
    volumes:
      - mysql_data:/var/lib/mysql
      - ../kiosk-image/FaMiLiS/server_database/schema.sql:/docker-entrypoint-initdb.d/01-familis-schema.sql:ro
  central-server:
    build: .
    container_name: central-server
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: familis_central
      FRAME_STORAGE_ROOT: /frames
    volumes:
      - ./frames:/frames
    labels:
      - traefik.enable=true
      - traefik.http.routers.central-server.rule=PathPrefix(`/`)
      - traefik.http.routers.central-server.entrypoints=central-api
      - traefik.http.routers.central-server.tls=true
      - traefik.http.services.central-server.loadbalancer.server.port=8000

  familis:
    build:
      context: ../kiosk-image
      dockerfile: Dockerfile
    container_name: familis
    ports:
      - "8765:8765"
    depends_on:
      central-server:
        condition: service_started
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:root@central-mysql:3306/familis_central
      EMOTION_SERVICE_URL: http://localhost:8765
      CENTRAL_SERVER_URL: http://central-server:8000
      DEFAULT_KIOSK_AGENT_ID: kiosk-01
      WEB_KIOSK_MODE: "true"
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      USE_HTTPS: "true"
      SSL_KEY_FILE: /app/certs/key.pem
      SSL_CERT_FILE: /app/certs/cert.pem
    volumes:
      - ../certs:/app/certs:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.familis.rule=PathPrefix(`/`)
      - traefik.http.routers.familis.entrypoints=websecure,familis
      - traefik.http.routers.familis.tls=true
      - traefik.http.routers.familis.service=familis
      - traefik.http.services.familis.loadbalancer.server.port=5173
      - traefik.http.services.familis.loadbalancer.server.scheme=https
      - traefik.http.routers.familis-api.rule=PathPrefix(`/`)
      - traefik.http.routers.familis-api.entrypoints=familis-api
      - traefik.http.routers.familis-api.tls=true
      - traefik.http.routers.familis-api.service=familis-api
      - traefik.http.services.familis-api.loadbalancer.server.port=8080
      - traefik.http.services.familis-api.loadbalancer.server.scheme=https

volumes:
  mysql_data:
