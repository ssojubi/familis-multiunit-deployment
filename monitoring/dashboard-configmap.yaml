        {
          "id": 22,
          "type": "timeseries",
          "title": "FER worker autoscaling: current and desired",
          "description": "HPA scales from 1 to 6 workers at 65% of requested CPU (250m per worker). Scale-down stabilization is 300 seconds. Frame count alone does not trigger scaling.",
          "gridPos": {
            "x": 12,
            "y": 23,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"familis\",horizontalpodautoscaler=\"fer-worker\"}",
              "legendFormat": "Current",
              "refId": "A",
              "instant": false
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"familis\",horizontalpodautoscaler=\"fer-worker\"}",
              "legendFormat": "Desired",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
