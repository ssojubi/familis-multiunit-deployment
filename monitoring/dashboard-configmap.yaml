        {
          "id": 5,
          "type": "timeseries",
          "title": "Frame processing + storage latency (p95, s)",
          "description": "95th percentile of successful newly stored frame attempts; includes prediction and storage. Not pure inference latency. No observations means no latency measurement. Missing data is not zero: check scrape health. Latency requires completed observations; rate queries require at least two scrapes.",
