            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "CPU usage per pod (cores)",
          "description": "FaMiLiS namespace only; excludes monitoring and other host processes. Pod cgroups include all containers once, without double-counting child cgroups. One-minute average. 1.0 = one core.",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"familis\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",pod!=\"\",id=~\".*pod[^/]+\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "RAM usage per pod",
          "description": "FaMiLiS namespace only; excludes monitoring and other host processes. Pod cgroups include all containers once, without double-counting child cgroups. Working-set memory.",
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"familis\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",pod!=\"\",id=~\".*pod[^/]+\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
