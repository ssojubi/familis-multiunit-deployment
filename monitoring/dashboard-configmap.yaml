apiVersion: v1
kind: ConfigMap
metadata:
  name: familis-stress-test-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  familis-stress-test.json: |
    {
      "uid": "familis-stress-test",
      "title": "FaMiLiS Stress Test",
      "schemaVersion": 41,
      "version": 7,
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "familis",
        "capstone"
      ],
      "panels": [
        {
          "id": 23,
          "type": "stat",
          "title": "central-api: metrics collection",
          "description": "UP means Prometheus can scrape the endpoint; it does not prove frame delivery. DOWN means a scrape failed; MISSING means no discovered target.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "min(up{namespace=\"familis\",container=\"central-api\"}) or vector(-1)",
              "refId": "A",
              "legendFormat": "central-api: metrics collection",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green"
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "-1": {
                      "text": "MISSING",
                      "color": "red"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 24,
          "type": "stat",
          "title": "fer-worker: metrics collection",
          "description": "UP means Prometheus can scrape the endpoint; it does not prove frame delivery. DOWN means a scrape failed; MISSING means no discovered target.",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "min(up{namespace=\"familis\",container=\"fer-worker\"}) or vector(-1)",
              "refId": "A",
              "legendFormat": "fer-worker: metrics collection",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green"
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "-1": {
                      "text": "MISSING",
                      "color": "red"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 25,
          "type": "stat",
          "title": "Registered kiosk WebSockets",
          "description": "Central API registry only. Browser sessions using the web server upload route may not register here; record actual devices separately.",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(familis_connected_kiosks{namespace=\"familis\",container=\"central-api\"})",
              "refId": "A",
              "legendFormat": "Registered kiosk WebSockets",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 26,
          "type": "stat",
          "title": "Worker CPU / requested CPU (%)",
          "description": "Autoscaling target is 65% of each worker\u2019s 0.25-core request (about 0.1625 cores). Kiosk connections alone do not scale workers.",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "100 * sum(rate(container_cpu_usage_seconds_total{namespace=\"familis\",container=\"fer-worker\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\"}[5m])) / sum(kube_pod_container_resource_requests{namespace=\"familis\",container=\"fer-worker\",resource=\"cpu\"})",
              "refId": "A",
              "legendFormat": "Worker CPU / requested CPU (%)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 27,
          "type": "stat",
          "title": "Frame ingest HTTP success (%)",
          "description": "2xx responses divided by all central ingest responses over five minutes. No requests means undefined, not 100%. Excludes browser network failures and requests rejected by the web server.",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "100 * sum(rate(familis_ingest_requests_total{namespace=\"familis\",container=\"central-api\",status_class=\"2xx\"}[5m])) / sum(rate(familis_ingest_requests_total{namespace=\"familis\",container=\"central-api\"}[5m]))",
              "refId": "A",
              "legendFormat": "Frame ingest HTTP success (%)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 28,
          "type": "stat",
          "title": "API ingest response time (mean, s)",
          "description": "Server-side ingest duration, including queue acknowledgement. Browser round-trip and session connection latency must be measured separately.",
          "gridPos": {
            "x": 6,
            "y": 5,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(rate(familis_ingest_request_seconds_sum{namespace=\"familis\",container=\"central-api\"}[5m])) / sum(rate(familis_ingest_request_seconds_count{namespace=\"familis\",container=\"central-api\"}[5m]))",
              "refId": "A",
              "legendFormat": "API ingest response time (mean, s)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 29,
          "type": "stat",
          "title": "Inference latency (mean, s)",
          "description": "Successful prediction calls: decoding, face detection, feature extraction and model prediction. Excludes queue and storage; includes no-face results and retried predictions. Requires updated worker image.",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(rate(familis_frame_inference_seconds_sum{namespace=\"familis\",container=\"fer-worker\"}[5m])) / sum(rate(familis_frame_inference_seconds_count{namespace=\"familis\",container=\"fer-worker\"}[5m]))",
              "refId": "A",
              "legendFormat": "Inference latency (mean, s)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 30,
          "type": "stat",
          "title": "Saved-result throughput (frames/s)",
          "description": "New database results per second averaged over five minutes. Replayed frame IDs do not increase this counter.",
          "gridPos": {
            "x": 18,
            "y": 5,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(rate(familis_frames_processed_total{namespace=\"familis\",container=\"fer-worker\"}[5m]))",
              "refId": "A",
              "legendFormat": "Saved-result throughput (frames/s)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 15,
          "type": "stat",
          "title": "CPU used now (cores)",
          "description": "FaMiLiS namespace only; excludes monitoring and other host processes. Pod cgroups include all containers once, without double-counting child cgroups. 1.0 means one CPU core; averaged over the last minute.",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"familis\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",pod!=\"\",id=~\".*pod[^/]+\"}[1m])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 16,
          "type": "stat",
          "title": "RAM used now",
          "description": "FaMiLiS namespace only; excludes monitoring and other host processes. Pod cgroups include all containers once, without double-counting child cgroups. Working-set memory, not disk storage.",
          "gridPos": {
            "x": 6,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(max by (pod) (container_memory_working_set_bytes{namespace=\"familis\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",pod!=\"\",id=~\".*pod[^/]+\"}))",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 17,
          "type": "stat",
          "title": "All running service pods (includes workers)",
          "description": "Shared web app, central API, Kafka, ZooKeeper, MySQL plus FER workers. With one worker, six running pods are expected even for one kiosk. This is not a kiosk count.",
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"familis\",phase=\"Running\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 18,
          "type": "stat",
          "title": "Ready FER worker pods (shared by kiosks)",
          "description": "Current ready FER workers. This is not the number of connected kiosks.",
          "gridPos": {
            "x": 18,
            "y": 10,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"familis\",deployment=\"fer-worker\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "No samples",
                      "color": "gray"
                    }
                  }
