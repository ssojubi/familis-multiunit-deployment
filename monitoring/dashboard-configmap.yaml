        {
          "id": 21,
          "type": "timeseries",
          "title": "Ready pods by deployment",
          "description": "Shows pod availability and scaling throughout the selected test period.",
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"familis\"}",
              "legendFormat": "{{deployment}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "noValue": "No samples \u2014 check metrics health",
