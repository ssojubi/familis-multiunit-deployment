apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.4.1
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              echo "Waiting for Kafka broker..."
              ready=0
              for i in {1..60}; do
                if kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                echo "  Not ready..."
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "Kafka did not become ready" >&2
                exit 1
              fi
              echo "Creating Kafka topics..."
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic video-frames --partitions 6 --replication-factor 1
              PARTITIONS=$(kafka-topics --bootstrap-server kafka:9092 --describe --topic video-frames | sed -n 's/.*PartitionCount: \([0-9]*\).*/\1/p')
              test -n "$PARTITIONS"
              if [ "$PARTITIONS" -lt 6 ]; then
                echo "Increasing video-frames from $PARTITIONS to 6 partitions..."
                kafka-topics --bootstrap-server kafka:9092 --alter --topic video-frames --partitions 6
              fi
              kafka-topics --bootstrap-server kafka:9092 --describe --topic video-frames
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic video-frames-failed --partitions 6 --replication-factor 1
              kafka-topics --bootstrap-server kafka:9092 --describe --topic video-frames-failed
