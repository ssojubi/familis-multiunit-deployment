apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: familis
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - secretName: familis-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: familis-web
                port:
                  number: 443
