apiVersion: apps/v1
kind: Deployment
metadata:
  name: familis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: familis
  template:
    metadata:
      labels:
        app: familis
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done
      containers:
        - name: familis
          image: familis-app:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 5173
            - name: api
              containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: database
            - name: CENTRAL_SERVER_URL
              value: http://central-api:8000
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-api-secret
                  key: token
            - name: AUTH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: familis-auth-secret
                  key: auth-token-secret
            - name: DEFAULT_KIOSK_ID
              value: kiosk-01
            - name: WEB_KIOSK_MODE
              value: "true"
            - name: HOST_LAN_IP
              value: ""
            - name: PUBLIC_ACCESS_URL
              value: ""
            - name: USE_HTTPS
              value: "true"
            - name: SSL_KEY_FILE
              value: /app/tls/tls.key
            - name: SSL_CERT_FILE
              value: /app/tls/tls.crt
          volumeMounts:
            - name: familis-tls
              mountPath: /app/tls
              readOnly: true
            - name: familis-uploads
              mountPath: /app/familis/server/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: familis-tls
          secret:
            secretName: familis-tls
        - name: familis-uploads
          persistentVolumeClaim:
            claimName: familis-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: familis-uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: familis-web
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  type: ClusterIP
  selector:
    app: familis
  ports:
    - name: https
      port: 443
      targetPort: 5173
    - name: web
      port: 5173
      targetPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: familis-api
spec:
  type: ClusterIP
  selector:
    app: familis
  ports:
    - name: api
      port: 8080
      targetPort: 8080
